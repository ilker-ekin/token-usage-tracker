name: CI

on:
  pull_request:
    branches: [main]
  # Also on main itself, so a direct push or a merge is tested and main
  # carries its own status.
  push:
    branches: [main]

# A newer push to the same pull request makes the older run pointless.
# Runs on main are never cancelled, so every commit there gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: token-usage-tracker
        run: ./mvnw test

  ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check and build
        working-directory: ui
        run: npm run build
