spring:
  application:
    name: token-usage-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/token_usage}
    username: ${DB_USERNAME:tut}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  auth:
    rate-limit:
      # Failed logins remembered per email and per client address.
      max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
      window: ${LOGIN_FAILURE_WINDOW:PT15M}
  jwt:
    # HS256 needs >= 32 bytes. The default only works under the 'dev'
    # profile — everywhere else startup fails unless JWT_SECRET is set
    # (enforced in JwtConfig).
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:PT12H}

  ingest:
    # Accepted window for a reported eventTime (ISO-8601 durations).
    max-future: ${INGEST_MAX_FUTURE:PT5M}
    max-event-age: ${INGEST_MAX_EVENT_AGE:P90D}
  pricing:
    litellm:
      url: ${LITELLM_PRICING_URL:https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}
      connect-timeout: PT2S
      read-timeout: PT5S
      cache-ttl: PT10M
      failure-backoff: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  # Behind the nginx proxy every request arrives from nginx's address. With
  # this, X-Forwarded-For is honored when it comes from a private-network
  # peer (Tomcat's RemoteIpValve default), so the login rate limit sees the
  # real client. A header sent by a client connecting directly is ignored.
  forward-headers-strategy: native
