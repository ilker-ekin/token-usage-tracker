spring:
  application:
    name: token-usage-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/token_usage}
    username: ${DB_USERNAME:tut}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    # HS256 needs >= 32 bytes. The default only works under the 'dev'
    # profile — everywhere else startup fails unless JWT_SECRET is set
    # (enforced in JwtConfig).
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:PT12H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
