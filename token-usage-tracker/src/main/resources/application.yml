spring:
  application:
    name: token-usage-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/token_usage}
    username: ${DB_USERNAME:tut}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Placeholder until JWT auth lands in Phase 1; never deploy permitAll
  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      # empty default → Spring keeps a generated random password
      password: ${SECURITY_USER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
