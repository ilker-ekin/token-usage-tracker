# Test-suite JWT secret: the committed dev default in application.yml is
# rejected at startup outside the 'dev' profile (see JwtConfig).
app.jwt.secret=test-suite-only-jwt-secret-0123456789abcdef

# The suite books events at fixed dates in 2026; the production default
# (90 days) would reject them as too old as the calendar moves on.
app.ingest.max-event-age=P3650D
