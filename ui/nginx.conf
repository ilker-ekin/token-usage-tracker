# Serves the SPA and proxies API routes to the backend, so the browser sees a
# single origin (the same arrangement the Vite dev proxy gives locally).
server {
    listen 8080;
    root /usr/share/nginx/html;

    location ~ ^/(auth|analytics|usage|model-pricing)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (e.g. /members) fall back to the SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
